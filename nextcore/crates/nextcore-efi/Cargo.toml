[package]
name = "nextcore-efi"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
uefi = { version = "0.40", features = ["alloc", "panic_handler"] }
nextcore-core = { path = "../nextcore-core", default-features = false }
uefi-raw = { version = "0.16", optional = true }

[features]
test-child = []
kernel-probe = []
hal-tables = []
kc-staging = []
console-control = ["dep:uefi-raw"]
console-probe = ["console-control"]
apfs-jumpstart = ["dep:uefi-raw"]

[[bin]]
name = "NXKERNEL"
path = "src/kernel.rs"
test = false
bench = false

[[bin]]
name = "BOOTX64"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "NXTEST"
path = "src/test_child.rs"
test = false
bench = false
required-features = ["test-child"]

[[bin]]
name = "NXHAL"
path = "src/hal_tables.rs"
test = false
bench = false
required-features = ["hal-tables"]

[[bin]]
name = "NXKC"
path = "src/kc.rs"
test = false
bench = false
required-features = ["kc-staging"]

[[bin]]
name = "NXCONSOLE"
path = "src/console_probe.rs"
test = false
bench = false
required-features = ["console-probe"]

[[bin]]
name = "NXAPFS"
path = "src/apfs_probe.rs"
test = false
bench = false
required-features = ["apfs-jumpstart"]

[[bin]]
name = "NXFSFIX"
path = "src/apfs_fixture.rs"
test = false
bench = false
required-features = ["apfs-jumpstart", "test-child"]
