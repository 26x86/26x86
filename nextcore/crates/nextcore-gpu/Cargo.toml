[package]
name = "nextcore-gpu"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
log = "0.4"
thiserror = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ash = { version = "0.38", optional = true }

[features]
default = []
vulkan = ["dep:ash"]

[[example]]
name = "vulkan_compute"
required-features = ["vulkan"]
