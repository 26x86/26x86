name: VenFire TCG contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  venfire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/venfire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run VenFire policy, packaging and unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build release wheel through the guarded backend
        run: python3 -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Validate the root VMApple TCG contract
        working-directory: .
        run: python3 sandbox/efi/verify_vmapple_tcg_contract.py --compact

  qemu-patch-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install source audit dependencies
        run: sudo apt-get update && sudo apt-get install -y git
      - name: Apply the exact QEMU patch series to the pinned source
        run: |
          git init "$RUNNER_TEMP/qemu"
          git -C "$RUNNER_TEMP/qemu" remote add origin https://github.com/qemu/qemu.git
          git -C "$RUNNER_TEMP/qemu" fetch --depth=1 origin ff1d2d19d7e24893e2012d879f8e73077e17b9bd
          git -C "$RUNNER_TEMP/qemu" checkout --detach ff1d2d19d7e24893e2012d879f8e73077e17b9bd
          while read -r patch; do
            test -z "$patch" && continue
            git -C "$RUNNER_TEMP/qemu" apply --check "research/venfire/patches/$patch"
            git -C "$RUNNER_TEMP/qemu" apply "research/venfire/patches/$patch"
          done < research/venfire/patches/series
      - name: Run source audit
        working-directory: research/venfire
        run: python3 tools/backend_audit.py --source "$RUNNER_TEMP/qemu" --require-patched
