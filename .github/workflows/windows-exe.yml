name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows-exe:
    name: Build 26x86.exe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install requests pywebview packaging markdown2 pyinstaller

      - name: Build Windows EXE
        shell: pwsh
        run: |
          .\scripts\build-windows-exe.ps1 -Clean

      - name: Verify EXE output
        shell: pwsh
        run: |
          if (-not (Test-Path ".\dist\26x86\26x86.exe")) {
            throw "dist/26x86/26x86.exe not found"
          }
          $taskExe = Start-Process -FilePath '.\dist\26x86\26x86.exe' -ArgumentList '--smoke-report', 'build\frozen-smoke.json' -WindowStyle Hidden -PassThru
          if (-not $taskExe.WaitForExit(60000)) { throw "EXE smoke test timed out" }
          $report = Get-Content -LiteralPath 'build\frozen-smoke.json' -Raw | ConvertFrom-Json
          if ($taskExe.ExitCode -ne 0 -or -not $report.ok) { throw "EXE backend smoke test failed" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 26x86-windows-exe
          path: dist/**
          if-no-files-found: error
