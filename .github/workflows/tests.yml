  x86-efi-picker-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Build production picker and authored child
        run: cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features test-child --bin BOOTX64 --bin NXTEST
      - name: Recover failed targets through the production picker
        run: python3 nextcore/tools/verify_picker_recovery_ovmf.py --efi nextcore/target/x86_64-unknown-uefi/release/BOOTX64.efi --child nextcore/target/x86_64-unknown-uefi/release/NXTEST.efi --output "$RUNNER_TEMP/picker-recovery"
      - name: Recover unusable configuration through actual firmware input
        run: |
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --bin BOOTX64
          cp nextcore/target/x86_64-unknown-uefi/release/BOOTX64.efi "$RUNNER_TEMP/config-baseline.efi"
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features config-recovery-probe --bin NXCONFIG
          python3 Tools/verify_config_recovery_ovmf.py --efi "$RUNNER_TEMP/config-baseline.efi" --probe nextcore/target/x86_64-unknown-uefi/release/NXCONFIG.efi --child nextcore/target/x86_64-unknown-uefi/release/NXTEST.efi --output "$RUNNER_TEMP/config-recovery"
      - name: Verify firmware watchdog ownership against an armed control
        run: |
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features watchdog-probe --bin NXWATCHDOG
          cp nextcore/target/x86_64-unknown-uefi/release/NXWATCHDOG.efi "$RUNNER_TEMP/watchdog-disabled.efi"
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features watchdog-probe-armed --bin NXWATCHDOG
          python3 nextcore/tools/verify_watchdog_ovmf.py --disabled-efi "$RUNNER_TEMP/watchdog-disabled.efi" --armed-efi nextcore/target/x86_64-unknown-uefi/release/NXWATCHDOG.efi --timeout 60 --output "$RUNNER_TEMP/watchdog-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextcore-picker-recovery
          path: |
            ${{ runner.temp }}/picker-recovery/**/*.json
            ${{ runner.temp }}/picker-recovery/**/*.log
            ${{ runner.temp }}/watchdog-proof/**/*.json
            ${{ runner.temp }}/watchdog-proof/**/*.log
            ${{ runner.temp }}/config-recovery/**/*.json
            ${{ runner.temp }}/config-recovery/**/*.log
            ${{ runner.temp }}/config-recovery/**/*.ppm
