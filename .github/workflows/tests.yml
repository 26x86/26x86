name: NextCore workspace tests

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-tests:
    name: workspace-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with module submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-uefi, aarch64-unknown-uefi
      - name: Install native firmware build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Verify module checkout and local Cargo resolution
        run: python3 Tools/verify_nextcore_submodules.py --cargo --require-clean
      - name: Workspace tests
        run: cargo test --workspace
        working-directory: nextcore
      - name: Compare SGPU grant decisions with the VSK C policy
        run: NEXTCORE_VSK_POLICY_ROOT="$GITHUB_WORKSPACE/sandbox/vsk" cargo test -p nextcore-apls --test sgpu_grant -- --include-ignored
        working-directory: nextcore
      - name: Clippy (host crates, warnings surfaced)
        run: cargo clippy --workspace --exclude nextcore-efi --all-targets
        working-directory: nextcore
      - name: Clippy (firmware on its actual UEFI target)
        run: cargo clippy -p nextcore-efi --target x86_64-unknown-uefi --all-features
        working-directory: nextcore

  x86-efi-arm-jit:
    name: x86-efi-arm-jit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Install firmware test tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-system-x86 ovmf
      - name: Link default and authored-probe EFI images
        working-directory: nextcore
        run: |
          cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit --bin NXARMJIT
          cp target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/NXARMJIT-default.efi"
          cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-probe,arm-jit-trace --bin NXARMJIT
          cp target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/NXARMJIT-probe.efi"
      - name: Execute ARM64e JIT, PAC, GOP and rejection cases in x86 EFI
        run: |
          python3 nextcore/tools/verify_arm_jit_ovmf.py \
            --efi-default "$RUNNER_TEMP/NXARMJIT-default.efi" \
            --efi-probe "$RUNNER_TEMP/NXARMJIT-probe.efi" \
            --output "$RUNNER_TEMP/nextcore-arm-jit-proof"
          python3 nextcore/tools/verify_arm_sptm_prefix_ovmf.py \
            --efi-trace "$RUNNER_TEMP/NXARMJIT-probe.efi" \
            --efi-default "$RUNNER_TEMP/NXARMJIT-default.efi" \
            --output "$RUNNER_TEMP/nextcore-sptm-prefix-proof"
      - name: Execute platform profile and IRQ/FIQ vector cases in x86 EFI
        run: |
          python3 nextcore/tools/verify_arm_platform_irq_ovmf.py \
            --efi "$RUNNER_TEMP/NXARMJIT-probe.efi" \
            --output "$RUNNER_TEMP/nextcore-platform-irq-proof"
      - name: Execute integer pair memory and precise faults in x86 EFI
        run: |
          python3 nextcore/artifacts/arm-pair-memory-20260909/verify_pair_ovmf.py \
            --tools nextcore/tools --efi "$RUNNER_TEMP/NXARMJIT-probe.efi" \
            --output "$RUNNER_TEMP/nextcore-pair-memory-proof"
          python3 nextcore/artifacts/arm-scalar-memory-20260909/verify_scalar_ovmf.py \
            --tools nextcore/tools --efi "$RUNNER_TEMP/NXARMJIT-probe.efi" \
            --output "$RUNNER_TEMP/nextcore-scalar-memory-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextcore-x86-efi-arm-jit
          path: |
            ${{ runner.temp }}/NXARMJIT-*.efi
            ${{ runner.temp }}/nextcore-arm-jit-proof/report.json
            ${{ runner.temp }}/nextcore-arm-jit-proof/*/serial.log
            ${{ runner.temp }}/nextcore-sptm-prefix-proof/report.json
            ${{ runner.temp }}/nextcore-sptm-prefix-proof/*/serial.log
            ${{ runner.temp }}/nextcore-platform-irq-proof/report.json
            ${{ runner.temp }}/nextcore-platform-irq-proof/*/serial.log
            ${{ runner.temp }}/nextcore-scalar-memory-proof/report.json
            ${{ runner.temp }}/nextcore-scalar-memory-proof/*/serial.log
            ${{ runner.temp }}/nextcore-pair-memory-proof/report.json
            ${{ runner.temp }}/nextcore-pair-memory-proof/*/serial.log

  x86-efi-memory-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Install native memory firmware test tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-system-x86 ovmf
      - name: Check memory proof failure detection
        run: python3 tests/test_arm_memory_provider_runner.py -v
      - name: Build direct, provider and combined bounded-tier firmware
        working-directory: nextcore
        run: |
          cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-probe,arm-jit-trace --bin NXARMJIT
          cp target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/NXARMJIT-direct.efi"
          cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-memory-provider --bin NXARMJIT
          cp target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/NXARMJIT-memory.efi"
          cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-memory-provider,arm-jit-tiered-trace --bin NXARMJIT
          cp target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/NXARMJIT-tiered.efi"
      - name: Execute Rust memory callbacks, precise faults and bounded tiers
        run: |
          python3 nextcore/tools/verify_arm_memory_provider_ovmf.py \
            --provider-efi "$RUNNER_TEMP/NXARMJIT-memory.efi" \
            --direct-efi "$RUNNER_TEMP/NXARMJIT-direct.efi" \
            --tiered-efi "$RUNNER_TEMP/NXARMJIT-tiered.efi" \
            --output "$RUNNER_TEMP/nextcore-memory-proof"
      - name: Execute conditional comparison flags through the memory service
        run: |
          python3 nextcore/tools/verify_arm_conditional_compare_ovmf.py \
            --efi "$RUNNER_TEMP/NXARMJIT-tiered.efi" \
            --ise nextcore/crates/nextcore-ise \
            --output "$RUNNER_TEMP/nextcore-conditional-proof" --require-memory-provider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextcore-x86-efi-memory-provider
          path: |
            ${{ runner.temp }}/NXARMJIT-*.efi
            ${{ runner.temp }}/nextcore-memory-proof/**/*.json
            ${{ runner.temp }}/nextcore-memory-proof/**/*.log
            ${{ runner.temp }}/nextcore-conditional-proof/**/*.json
            ${{ runner.temp }}/nextcore-conditional-proof/**/*.log

  x86-efi-stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Install native translated-memory firmware tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-system-x86 ovmf
      - name: Check stage-1 receipt rejection and native callback semantics
        run: |
          python3 -m unittest discover -s nextcore/crates/nextcore-efi/tools -p test_stage1_reader.py -v
          python3 nextcore/crates/nextcore-ise/tools/probe_efi_stage1_provider.py --work-dir "$RUNNER_TEMP/native-stage1" --output "$RUNNER_TEMP/native-stage1.json"
      - name: Build the authored stage-1 EFI consumer
        working-directory: nextcore
        run: cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-stage1-probe --bin NXMMU
      - name: Execute translated fetch and memory on the x86 EFI computer
        run: |
          python3 nextcore/crates/nextcore-efi/tools/verify_stage1_ovmf.py \
            --efi-probe nextcore/target/x86_64-unknown-uefi/release/NXMMU.efi \
            --output "$RUNNER_TEMP/nextcore-stage1-proof"
      - name: Check owned backing and lifetime gates
        working-directory: nextcore
        run: |
          cargo test --locked -p nextcore-core --no-default-features
          cargo test --locked -p nextcore-core --doc
      - name: Link actual debug firmware with all EFI features
        working-directory: nextcore
        run: cargo build --locked -p nextcore-efi --target x86_64-unknown-uefi --all-features --bin NXAPFS
      - name: Execute owned guest DeviceTree consumption
        run: |
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-dt-probe --bin NXDT
          python3 nextcore/crates/nextcore-efi/tools/verify_dt_ledger_ovmf.py --efi-probe nextcore/target/x86_64-unknown-uefi/release/NXDT.efi --output "$RUNNER_TEMP/nextcore-dt-proof"
          python3 nextcore/crates/nextcore-efi/tools/check_dt_ledger_capture.py --report "$RUNNER_TEMP/nextcore-dt-proof/report.json" --output "$RUNNER_TEMP/nextcore-dt-reader.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextcore-x86-efi-stage1
          path: |
            ${{ runner.temp }}/native-stage1.json
            ${{ runner.temp }}/nextcore-stage1-proof/*.json
            ${{ runner.temp }}/nextcore-stage1-proof/*.log
            ${{ runner.temp }}/nextcore-dt-proof/*.json
            ${{ runner.temp }}/nextcore-dt-proof/*.log
            ${{ runner.temp }}/nextcore-dt-reader.json
