name: NextCore workspace tests

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-tests:
    name: workspace-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with module submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-uefi, aarch64-unknown-uefi
      - name: Install native firmware build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Verify module checkout and local Cargo resolution
        run: python3 Tools/verify_nextcore_submodules.py --cargo --require-clean
      - name: Workspace tests
        run: cargo test --workspace
        working-directory: nextcore
      - name: Compare SGPU grant decisions with the VSK C policy
        run: NEXTCORE_VSK_POLICY_ROOT="$GITHUB_WORKSPACE/sandbox/vsk" cargo test -p nextcore-apls --test sgpu_grant -- --include-ignored
        working-directory: nextcore
      - name: Clippy (host crates, warnings surfaced)
        run: cargo clippy --workspace --exclude nextcore-efi --all-targets
        working-directory: nextcore
      - name: Clippy (firmware on its actual UEFI target)
        run: |
          cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features test-child --bin NXTEST
          NEXTCORE_PICKER_CHILD="$GITHUB_WORKSPACE/nextcore/target/x86_64-unknown-uefi/release/NXTEST.efi" cargo clippy -p nextcore-efi --target x86_64-unknown-uefi --all-features
        working-directory: nextcore

  x86-efi-arm-jit:
    name: x86-efi-arm-jit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Install firmware test tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-system-x86 ovmf
      - name: Link default and authored-probe EFI images
        working-directory: nextcore
        run: |
          cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit --bin NXARMJIT
          cp target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/NXARMJIT-default.efi"
          cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-probe,arm-jit-trace --bin NXARMJIT
          cp target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/NXARMJIT-probe.efi"
      - name: Execute ARM64e JIT, PAC, GOP and rejection cases in x86 EFI
        run: |
          python3 nextcore/tools/verify_arm_jit_ovmf.py \
            --efi-default "$RUNNER_TEMP/NXARMJIT-default.efi" \
            --efi-probe "$RUNNER_TEMP/NXARMJIT-probe.efi" \
            --output "$RUNNER_TEMP/nextcore-arm-jit-proof"
          python3 nextcore/tools/verify_arm_sptm_prefix_ovmf.py \
            --efi-trace "$RUNNER_TEMP/NXARMJIT-probe.efi" \
            --efi-default "$RUNNER_TEMP/NXARMJIT-default.efi" \
            --output "$RUNNER_TEMP/nextcore-sptm-prefix-proof"
      - name: Execute platform profile and IRQ/FIQ vector cases in x86 EFI
        run: |
          python3 nextcore/tools/verify_arm_platform_irq_ovmf.py \
            --efi "$RUNNER_TEMP/NXARMJIT-probe.efi" \
            --output "$RUNNER_TEMP/nextcore-platform-irq-proof"
      - name: Execute integer pair memory and precise faults in x86 EFI
        run: |
          python3 nextcore/tools/verify_arm_pair_ovmf.py \
            --tools nextcore/tools --efi "$RUNNER_TEMP/NXARMJIT-probe.efi" \
            --output "$RUNNER_TEMP/nextcore-pair-memory-proof"
          python3 nextcore/tools/verify_arm_scalar_ovmf.py \
            --tools nextcore/tools --efi "$RUNNER_TEMP/NXARMJIT-probe.efi" \
            --output "$RUNNER_TEMP/nextcore-scalar-memory-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextcore-x86-efi-arm-jit
          path: |
            ${{ runner.temp }}/NXARMJIT-*.efi
            ${{ runner.temp }}/nextcore-arm-jit-proof/report.json
            ${{ runner.temp }}/nextcore-arm-jit-proof/*/serial.log
            ${{ runner.temp }}/nextcore-sptm-prefix-proof/report.json
            ${{ runner.temp }}/nextcore-sptm-prefix-proof/*/serial.log
            ${{ runner.temp }}/nextcore-platform-irq-proof/report.json
            ${{ runner.temp }}/nextcore-platform-irq-proof/*/serial.log
            ${{ runner.temp }}/nextcore-scalar-memory-proof/report.json
            ${{ runner.temp }}/nextcore-scalar-memory-proof/*/serial.log
            ${{ runner.temp }}/nextcore-pair-memory-proof/report.json
            ${{ runner.temp }}/nextcore-pair-memory-proof/*/serial.log

  x86-efi-memory-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Install native memory firmware test tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-system-x86 ovmf
      - name: Check memory proof failure detection
        run: python3 tests/test_arm_memory_provider_runner.py -v
      - name: Compare cached and uncached native execution with real W^X
        run: python3 nextcore/crates/nextcore-ise/runtime/tests/verify_provider_cache.py --output "$RUNNER_TEMP/provider-cache-native"
      - name: Build direct, provider and combined bounded-tier firmware
        working-directory: nextcore
        run: |
          cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-probe,arm-jit-trace --bin NXARMJIT
          cp target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/NXARMJIT-direct.efi"
          cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-memory-provider --bin NXARMJIT
          cp target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/NXARMJIT-memory.efi"
          cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-memory-provider,arm-jit-tiered-trace --bin NXARMJIT
          cp target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/NXARMJIT-tiered.efi"
      - name: Execute Rust memory callbacks, precise faults and bounded tiers
        run: |
          python3 nextcore/tools/verify_arm_memory_provider_ovmf.py \
            --provider-efi "$RUNNER_TEMP/NXARMJIT-memory.efi" \
            --direct-efi "$RUNNER_TEMP/NXARMJIT-direct.efi" \
            --tiered-efi "$RUNNER_TEMP/NXARMJIT-tiered.efi" \
            --output "$RUNNER_TEMP/nextcore-memory-proof"
      - name: Execute conditional comparison flags through the memory service
        run: |
          python3 nextcore/tools/verify_arm_conditional_compare_ovmf.py \
            --efi "$RUNNER_TEMP/NXARMJIT-tiered.efi" \
            --ise nextcore/crates/nextcore-ise \
            --output "$RUNNER_TEMP/nextcore-conditional-proof" --require-memory-provider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextcore-x86-efi-memory-provider
          path: |
            ${{ runner.temp }}/NXARMJIT-*.efi
            ${{ runner.temp }}/nextcore-memory-proof/**/*.json
            ${{ runner.temp }}/nextcore-memory-proof/**/*.log
            ${{ runner.temp }}/nextcore-conditional-proof/**/*.json
            ${{ runner.temp }}/nextcore-conditional-proof/**/*.log

  x86-efi-stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Install native translated-memory firmware tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-system-x86 qemu-system-arm ovmf
      - name: Check stage-1 receipt rejection and native callback semantics
        run: |
          python3 -m unittest discover -s nextcore/crates/nextcore-efi/tools -p test_stage1_reader.py -v
          python3 nextcore/crates/nextcore-ise/tools/probe_efi_stage1_provider.py --work-dir "$RUNNER_TEMP/native-stage1" --output "$RUNNER_TEMP/native-stage1.json"
          python3 nextcore/crates/nextcore-ise/runtime/tests/verify_mapped_native.py --output "$RUNNER_TEMP/mapped-native"
          python3 nextcore/crates/nextcore-ise/runtime/tests/verify_unscaled_native.py --output "$RUNNER_TEMP/unscaled-native"
          python3 nextcore/crates/nextcore-ise/runtime/tests/verify_logical_shifted_native.py --output "$RUNNER_TEMP/logical-shifted-native"
          python3 nextcore/crates/nextcore-ise/runtime/tests/verify_indexed_native.py --output "$RUNNER_TEMP/indexed-native"
          python3 nextcore/crates/nextcore-ise/runtime/tests/verify_variable_shift_native.py --output "$RUNNER_TEMP/variable-shift-native"
          python3 nextcore/crates/nextcore-ise/runtime/tests/verify_zfr0_native.py --output "$RUNNER_TEMP/zfr0-native"
          python3 nextcore/crates/nextcore-ise/runtime/tests/verify_isar0_native.py --output "$RUNNER_TEMP/isar0-native"
          python3 nextcore/crates/nextcore-ise/runtime/tests/verify_isar2_native.py --output "$RUNNER_TEMP/isar2-native"
          python3 nextcore/crates/nextcore-ise/runtime/tests/verify_mmfr0_native.py --output "$RUNNER_TEMP/mmfr0-native"
          python3 nextcore/crates/nextcore-ise/runtime/tests/verify_asid8_native.py --output "$RUNNER_TEMP/asid8-native"
          python3 nextcore/crates/nextcore-ise/runtime/tests/verify_optional_tcr.py --output "$RUNNER_TEMP/optional-tcr"
      - name: Compare hierarchical permissions with authored Arm execution
        run: |
          python3 nextcore/crates/nextcore-ise/runtime/tests/hierarchy_oracle/run.py --output "$RUNNER_TEMP/hierarchy-arm"
          python3 nextcore/crates/nextcore-ise/runtime/tests/verify_hierarchy_native.py --output "$RUNNER_TEMP/hierarchy-native" --arm-receipt "$RUNNER_TEMP/hierarchy-arm/receipt.json"
      - name: Build the authored stage-1 EFI consumer
        working-directory: nextcore
        run: cargo build --locked --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-stage1-probe --bin NXMMU --bin NXASID --bin NXPERM
      - name: Execute translated fetch and memory on the x86 EFI computer
        run: |
          python3 nextcore/crates/nextcore-efi/tools/verify_stage1_ovmf.py \
            --efi-probe nextcore/target/x86_64-unknown-uefi/release/NXMMU.efi \
            --output "$RUNNER_TEMP/nextcore-stage1-proof"
          python3 nextcore/crates/nextcore-efi/tools/verify_asid_ovmf.py \
            --efi-probe nextcore/target/x86_64-unknown-uefi/release/NXASID.efi \
            --output "$RUNNER_TEMP/nextcore-asid8-proof"
          python3 nextcore/crates/nextcore-efi/tools/verify_hierarchy_ovmf.py \
            --efi-probe nextcore/target/x86_64-unknown-uefi/release/NXPERM.efi \
            --output "$RUNNER_TEMP/nextcore-hierarchy-proof"
      - name: Check owned backing and lifetime gates
        working-directory: nextcore
        run: |
          cargo test --locked -p nextcore-core --no-default-features
          cargo test --locked -p nextcore-core --doc
      - name: Link actual debug firmware with all EFI features
        working-directory: nextcore
        run: cargo build --locked -p nextcore-efi --target x86_64-unknown-uefi --all-features --bin NXAPFS
      - name: Execute owned guest DeviceTree consumption
        run: |
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-dt-probe --bin NXDT
          python3 nextcore/crates/nextcore-efi/tools/verify_dt_ledger_ovmf.py --efi-probe nextcore/target/x86_64-unknown-uefi/release/NXDT.efi --output "$RUNNER_TEMP/nextcore-dt-proof"
          python3 nextcore/crates/nextcore-efi/tools/check_dt_ledger_capture.py --report "$RUNNER_TEMP/nextcore-dt-proof/report.json" --output "$RUNNER_TEMP/nextcore-dt-reader.json"
      - name: Execute one-way MMU activation and captured native comparison
        run: |
          python3 nextcore/crates/nextcore-ise/tools/probe_dynamic_memory.py --work-dir "$RUNNER_TEMP/native-dynamic" --output "$RUNNER_TEMP/native-dynamic.json"
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-dynamic-probe --bin NXDYN
          python3 nextcore/crates/nextcore-efi/tools/verify_dynamic_ovmf.py --efi-probe nextcore/target/x86_64-unknown-uefi/release/NXDYN.efi --output "$RUNNER_TEMP/nextcore-dynamic-proof"
          python3 nextcore/crates/nextcore-efi/tools/check_dynamic_capture.py --report "$RUNNER_TEMP/nextcore-dynamic-proof/report.json" --output "$RUNNER_TEMP/nextcore-dynamic-reader.json"
          python3 -B nextcore/tools/dynamic_comparison/compare.py --oracle nextcore/artifacts/arm-dynamic-oracle-20260909 --runtime nextcore/crates/nextcore-ise/runtime --output "$RUNNER_TEMP/dynamic-arm-comparison" --rustc "$(command -v rustc)"
          python3 -B nextcore/tools/dynamic_comparison/test_compare.py --oracle nextcore/artifacts/arm-dynamic-oracle-20260909 --evidence "$RUNNER_TEMP/dynamic-arm-comparison"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextcore-x86-efi-stage1
          path: |
            ${{ runner.temp }}/native-stage1.json
            ${{ runner.temp }}/mapped-native/receipt.json
            ${{ runner.temp }}/unscaled-native/receipt.json
            ${{ runner.temp }}/unscaled-native/*.log
            ${{ runner.temp }}/logical-shifted-native/receipt.json
            ${{ runner.temp }}/logical-shifted-native/*.log
            ${{ runner.temp }}/indexed-native/receipt.json
            ${{ runner.temp }}/indexed-native/*.log
            ${{ runner.temp }}/variable-shift-native/receipt.json
            ${{ runner.temp }}/variable-shift-native/*.log
            ${{ runner.temp }}/zfr0-native/receipt.json
            ${{ runner.temp }}/zfr0-native/*.log
            ${{ runner.temp }}/isar0-native/receipt.json
            ${{ runner.temp }}/isar0-native/*.log
            ${{ runner.temp }}/isar2-native/receipt.json
            ${{ runner.temp }}/isar2-native/*.log
            ${{ runner.temp }}/mmfr0-native/receipt.json
            ${{ runner.temp }}/mmfr0-native/*.log
            ${{ runner.temp }}/asid8-native/receipt.json
            ${{ runner.temp }}/asid8-native/*.json
            ${{ runner.temp }}/optional-tcr/receipt.json
            ${{ runner.temp }}/optional-tcr/*.log
            ${{ runner.temp }}/nextcore-asid8-proof/*.json
            ${{ runner.temp }}/nextcore-asid8-proof/*.log
            ${{ runner.temp }}/hierarchy-arm/**/*.json
            ${{ runner.temp }}/hierarchy-arm/**/*.log
            ${{ runner.temp }}/hierarchy-arm/**/raw.bin
            ${{ runner.temp }}/hierarchy-native/*.json
            ${{ runner.temp }}/hierarchy-native/*.log
            ${{ runner.temp }}/hierarchy-native/*.snapshot*
            ${{ runner.temp }}/nextcore-hierarchy-proof/*.json
            ${{ runner.temp }}/nextcore-hierarchy-proof/*.log
            ${{ runner.temp }}/nextcore-stage1-proof/*.json
            ${{ runner.temp }}/nextcore-stage1-proof/*.log
            ${{ runner.temp }}/nextcore-dt-proof/*.json
            ${{ runner.temp }}/nextcore-dt-proof/*.log
            ${{ runner.temp }}/nextcore-dt-reader.json
            ${{ runner.temp }}/native-dynamic.json
            ${{ runner.temp }}/nextcore-dynamic-proof/*.json
            ${{ runner.temp }}/nextcore-dynamic-proof/*.log
            ${{ runner.temp }}/nextcore-dynamic-reader.json
            ${{ runner.temp }}/dynamic-arm-comparison/receipt.json

  x86-efi-deep-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Install authored firmware tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-system-x86 ovmf
      - name: Check trace selection and fragmented UART collection
        run: python3 -m unittest discover -s nextcore/tools -p 'test_trace_*.py'
      - name: Build explicitly selected deep diagnostics
        run: cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-deep-trace --bin NXARMJIT
      - name: Execute arithmetic through the production trace consumer
        run: |
          python3 nextcore/tools/verify_ubfm_consumer_ovmf.py --efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --output "$RUNNER_TEMP/ubfm-efi"
          python3 nextcore/tools/verify_ubfm_consumer_ovmf.py --efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --instruction-family extended --output "$RUNNER_TEMP/extended-efi"
          python3 nextcore/tools/verify_ubfm_consumer_ovmf.py --efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --instruction-family select --output "$RUNNER_TEMP/select-efi"
          python3 nextcore/tools/verify_ubfm_consumer_ovmf.py --efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --instruction-family register-memory --output "$RUNNER_TEMP/register-memory-efi"
          python3 nextcore/tools/verify_ubfm_consumer_ovmf.py --efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --instruction-family test-bit --output "$RUNNER_TEMP/test-bit-efi"
          python3 nextcore/tools/verify_ubfm_consumer_ovmf.py --efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --instruction-family multiply --output "$RUNNER_TEMP/multiply-efi"
      - name: Execute deep budget and reject malformed selections
        run: |
          python3 nextcore/tools/verify_deep_budget_ovmf.py --tools nextcore/tools --efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --default-efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --clamped-efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --core-source nextcore/crates/nextcore-core --efi-source nextcore/crates/nextcore-efi --recheck-provenance --output "$RUNNER_TEMP/deep-trace"
      - name: Build explicit long trace with observed framebuffer
        run: |
          cp nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/deep-only.efi"
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-long-trace,arm-jit-video-readback,arm-jit-memory-observation,arm-jit-protection-observation --bin NXARMJIT
          cp nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/cached-long.efi"
      - name: Execute owned framebuffer and long budget contracts
        run: |
          python3 nextcore/tools/verify_boot_framebuffer_ovmf.py --efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --memory-observation --output "$RUNNER_TEMP/observed-framebuffer"
          python3 nextcore/tools/verify_ubfm_consumer_ovmf.py --efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --instruction-family bitfield-merge --long-diagnostic --output "$RUNNER_TEMP/long-bfm"
          if python3 nextcore/tools/verify_ubfm_consumer_ovmf.py --efi "$RUNNER_TEMP/deep-only.efi" --instruction-family bitfield-merge --long-diagnostic --output "$RUNNER_TEMP/long-old-negative"; then
            exit 1
          fi
          python3 -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"long-old-negative"; r=json.loads((p/"receipt.json").read_text()); f=json.loads((p/"firmware/report.json").read_text()); assert not r["passed"] and r["checks"]["inputs_preserved"] and any(m.startswith("NXARMJIT: TRACE_CONFIG_INVALID") for m in f["markers"])'
      - name: Compare final cached and uncached EFI permission transitions
        run: |
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-long-trace,arm-jit-video-readback,arm-jit-memory-observation,arm-jit-protection-observation,arm-jit-provider-uncached --bin NXARMJIT
          python3 nextcore/tools/verify_provider_cache_ovmf.py --cached-efi "$RUNNER_TEMP/cached-long.efi" --uncached-efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --output "$RUNNER_TEMP/provider-cache-efi"
      - name: Execute explicit initialization bound and reject the old build
        run: |
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-initialization-trace,arm-jit-protection-observation --bin NXARMJIT
          python3 nextcore/tools/verify_ubfm_consumer_ovmf.py --efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --instruction-family bitfield-merge --initialization-diagnostic --output "$RUNNER_TEMP/initialization-bfm"
          if python3 nextcore/tools/verify_ubfm_consumer_ovmf.py --efi "$RUNNER_TEMP/cached-long.efi" --instruction-family bitfield-merge --initialization-diagnostic --output "$RUNNER_TEMP/initialization-old-negative"; then
            exit 1
          fi
          python3 -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"initialization-old-negative"; r=json.loads((p/"receipt.json").read_text()); f=json.loads((p/"firmware/report.json").read_text()); assert not r["passed"] and r["checks"]["inputs_preserved"] and any(m.startswith("NXARMJIT: TRACE_CONFIG_INVALID") for m in f["markers"])'
      - name: Execute explicit mapped entry with cached, uncached and unobserved controls
        run: |
          python3 -m unittest discover -s nextcore/tools -p test_trace_mapped.py -v
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-mapped-trace,arm-jit-video-readback,arm-jit-memory-observation,arm-jit-protection-observation --bin NXARMJIT
          cp nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/mapped-cached.efi"
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-mapped-trace,arm-jit-video-readback,arm-jit-memory-observation,arm-jit-protection-observation,arm-jit-provider-uncached --bin NXARMJIT
          cp nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi "$RUNNER_TEMP/mapped-uncached.efi"
          cargo build --locked --manifest-path nextcore/Cargo.toml --release -p nextcore-efi --target x86_64-unknown-uefi --features arm-jit-mapped-trace,arm-jit-video-readback,arm-jit-protection-observation --bin NXARMJIT
          python3 nextcore/tools/verify_mapped_trace_ovmf.py --cached-efi "$RUNNER_TEMP/mapped-cached.efi" --uncached-efi "$RUNNER_TEMP/mapped-uncached.efi" --unobserved-efi nextcore/target/x86_64-unknown-uefi/release/NXARMJIT.efi --old-efi "$RUNNER_TEMP/cached-long.efi" --output "$RUNNER_TEMP/mapped-efi"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextcore-deep-trace
          path: |
            ${{ runner.temp }}/mapped-efi/**/*.json
            ${{ runner.temp }}/mapped-efi/**/*.log
