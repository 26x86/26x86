name: Deploy documentation site

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'Tools/package_prebuilt_efi.py'
      - 'Tools/test_package_prebuilt_efi.py'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read immutable runtime source pin
        id: prebuilt
        run: |
          python - <<'PY'
          import json, os, re
          spec = json.load(open('docs/data/prebuilt.json'))
          assert re.fullmatch('[0-9a-f]{40}', spec['source_commit'])
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', spec['rust_toolchain'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('commit=' + spec['source_commit'] + '\n')
              out.write('toolchain=' + spec['rust_toolchain'] + '\n')
          PY
      - name: Checkout pinned runtime separately
        uses: actions/checkout@v4
        with:
          repository: 26x86/26x86
          ref: ${{ steps.prebuilt.outputs.commit }}
          path: runtime-source
          submodules: recursive
      - name: Install UEFI compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld
          rustup toolchain install '${{ steps.prebuilt.outputs.toolchain }}' --profile minimal --target x86_64-unknown-uefi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs Material
        run: pip install -r requirements-docs.txt
      - name: Build site
        run: mkdocs build --strict
      - name: Test package validation failures
        run: python -m unittest discover -s Tools -p test_package_prebuilt_efi.py -v
      - name: Build mandatory EFI archive
        run: >-
          python Tools/package_prebuilt_efi.py --spec docs/data/prebuilt.json
          --source runtime-source --target-dir "$RUNNER_TEMP/prebuilt-target"
          --output site/prebuiltefi.zip
      - name: Verify mandatory archive before upload
        run: >-
          python Tools/package_prebuilt_efi.py --spec docs/data/prebuilt.json
          --verify-only --output site/prebuiltefi.zip
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
