site_name: NextCore
site_description: NextCore EFI boot engineering for macOS 26 Tahoe and experimental macOS 27 Golden Gate HAL and Metal support
site_url: https://26x86.github.io/26x86/
repo_url: https://github.com/26x86/26x86
repo_name: 26x86/26x86
edit_uri: edit/main/docs/

docs_dir: docs

# Drafts, session notes, research scrapbooks and agent-internal documents are
# not published to the site. Public engineering docs (design/build-plan/
# boundary) remain reachable from the nav.
exclude_docs: |
  EXTREME-*
  RESEARCH_*
  IBOOT_*
  SkyLight-*
  Tahoe-*
  STAGE-WORKFLOW.md
  WIP-STATUS.md
  ABSTRACTION_BINARIES.md
  NEXTCORE_CURRENT_CONTEXT.md
  NEXTCORE_PROMPTS.md
  ISOLATED_INVENTORY.md
  LICENSE.md
  README.en.md
  Icon-Composer-*.zip
  ResXtreme.zip
  validation/**
  wiki/Home.md
  wiki/README.en.md

theme:
  name: material
  language: en
  icon:
    logo: material/engine-outline
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
    - header.autohide
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

# Legacy wiki pages link to files outside docs/ (../../SOURCE.md, nextcore/…,
# integration/…). Those are repository-internal references we keep as-is;
# only structural breakage (nav, templates, missing pages) fails a strict build.
validation:
  links:
    not_found: ignore
    anchors: ignore
    unrecognized_links: ignore

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

copyright: |
  <a href="https://github.com/26x86/26x86">NextCore</a> — clean-room EFI boot research and compatibility tooling. Not affiliated with or endorsed by Apple.

nav:
