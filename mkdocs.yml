  - Quick start:
      - wiki/README.md
      - Getting started: wiki/Getting-Started.md
      - Supported hardware: wiki/Supported-Models.md
      - Setup guides: SETUP.md
      - Apple Silicon sandbox: APPLE_SILICON_SANDBOX.md
  - macOS compatibility:
      - wiki/macOS-Support.md
      - Pre-AVX Mac Pro: wiki/Pre-AVX-Mac-Pro.md
      - T2 Mac notes: wiki/T2-Mac-Notes.md
      - MacPro5,1 Vega64 Tahoe profile: profiles/MacPro5-Vega64-Tahoe.md
      - Tahoe yellow screen: wiki/Mac-Pro-Tahoe-Yellow-Screen.md
      - Safari pre-AVX fix: wiki/Safari-PreAVX-Fix.md
  - External EFI integration:
      - wiki/OpenCore.md
      - Configuration: wiki/Configuration.md
      - EFI optimize this Mac: EFI-OPTIMIZE-THIS-MAC.md
      - Installation notes: wiki/Installation-Notes.md
      - Migration: wiki/Migration.md
      - Orphan files archive: wiki/Orphan-Files-Archive.md
      - Upstream repositories: wiki/Upstream-Repositories.md
  - Application:
      - wiki/Application.md
      - Mellow integration: MELLOW_INTEGRATION.md
      - VSK: VSK.md
      - Golden Gate GUI validation: QEMU_GOLDEN_GATE_GUI.md
  - Troubleshooting:
      - wiki/Troubleshooting.md
      - Known issues: wiki/Known-Issues.md
      - GPU limitations: wiki/GPU-Limitations.md
      - Warnings: wiki/Warnings.md
      - Disclaimer: wiki/Disclaimer.md
  - Boot engineering (NextCore):
      - Architecture: wiki/Architecture.md
      - Build and development: wiki/Build-and-Development.md
      - NextCore design: NEXTCORE_DESIGN.md
      - NextCore build plan: NEXTCORE_BUILD_PLAN.md
      - Boot runtime verification: BOOT_RUNTIME_VERIFICATION.md
      - Boot picker recovery: BOOT_PICKER_RECOVERY.md
      - Module repositories: wiki/Nextcore-Modules.md
      - Repository layout: REPOSITORY_LAYOUT.md
  - Contribution:
      - Developer guide: wiki/Developer.md
      - Branching and release policy: wiki/Branching-and-Release.md
      - Public/private boundary: PUBLIC_VS_PRIVATE_BOUNDARY.md
      - Privacy and disclosure: wiki/Privacy-and-Disclosure.md
  - Reference:
